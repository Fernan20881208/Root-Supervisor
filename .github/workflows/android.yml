name: Build Android APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile two APKs
        run: gradle --no-daemon :child:assembleDebug :parent:assembleDebug
      - name: Child APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-Supervisor-Child
          path: child/build/outputs/apk/debug/child-debug.apk
          if-no-files-found: error
      - name: Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-Supervisor-Parent
          path: parent/build/outputs/apk/debug/parent-debug.apk
          if-no-files-found: error
